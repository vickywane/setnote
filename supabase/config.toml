# Local Supabase configuration for Setnote. Link to your own remote project separately.
project_id = "setnote"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "setnote://"
additional_redirect_urls = ["http://localhost:8081", "http://localhost:19006"]
